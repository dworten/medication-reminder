<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication Reminder — Sign in</title>
<meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<style>
  /* Arctic Frost, same tokens as /app/style.css. Kept inline and self-contained
     rather than linking the app stylesheet: that one lays the signed-in shell
     out as a grid with a sidebar, which is not what this page is. */
  :root {
    color-scheme: light dark;
    --bg: #f4f7fb; --surface: #ffffff; --raised: #eef3fa;
    --line: #ccd8e8; --line-strong: #7a8798;
    --fg: #14202f; --muted: #55637a;
    --accent: #2c5c9a; --accent-ink: #1f4a80; --accent-soft: #dde8f7; --on-accent: #ffffff;
    --ok: #0e7048; --ok-soft: #dcf1e6;
    --bad: #b3251c; --bad-soft: #fbe3e0;
    --radius: .625rem; --radius-sm: .375rem;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720; --surface: #16202c; --raised: #1a2531;
      --line: #2c3a4b; --line-strong: #6b8199;
      --fg: #e8eef6; --muted: #a3b1c4;
      --accent: #8ab8ec; --accent-ink: #a9cdf5; --accent-soft: #1c3049; --on-accent: #0f1720;
      --ok: #63d29c; --ok-soft: #14322a;
      --bad: #ff9086; --bad-soft: #3a1c1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.5rem;
    display: grid; place-items: center;
    font: 16px/1.55 var(--font);
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(24rem, 100%); }

  .brand {
    display: flex; align-items: center; gap: .5rem;
    margin-bottom: 1.25rem; font-weight: 700; font-size: 1.0625rem; letter-spacing: -.01em;
  }
  .brand::before {
    content: ""; width: .5rem; height: 1.5rem; border-radius: 999px; background: var(--accent);
  }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.75rem;
    box-shadow: 0 2px 8px rgb(20 32 47 / .08);
  }
  @media (prefers-color-scheme: dark) { .panel { box-shadow: 0 2px 8px rgb(0 0 0 / .45); } }

  h1 { font-size: 1.375rem; margin: 0; letter-spacing: -.015em; }
  p.sub { margin: .25rem 0 1.5rem; color: var(--muted); font-size: .875rem; }

  label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .3125rem; }
  .hint { font-weight: 400; color: var(--muted); }
  input {
    width: 100%; padding: .5rem .625rem; margin-bottom: 1rem; min-height: 2.75rem;
    font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  input:hover { border-color: var(--accent); }
  :where(input, button, a):focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm);
  }
  button {
    width: 100%; padding: .5rem; min-height: 2.75rem;
    font: inherit; font-weight: 600;
    color: var(--on-accent); background: var(--accent);
    border: 1px solid var(--accent); border-radius: var(--radius-sm); cursor: pointer;
  }
  button:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  button[disabled] {
    color: var(--muted); background: var(--raised); border-color: var(--line); cursor: default;
  }

  /* Empty until it says something, so the panel does not sit on a reserved gap. */
  #msg:not(:empty) {
    display: block; margin-top: 1rem; padding: .625rem .875rem;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--raised); color: var(--muted);
    font-size: .875rem;
  }
  #msg[data-kind="error"] { color: var(--bad); background: var(--bad-soft); border-color: var(--bad); font-weight: 600; }
  #msg[data-kind="ok"]    { color: var(--ok);  background: var(--ok-soft);  border-color: var(--ok);  font-weight: 600; }

  a { color: var(--accent); text-underline-offset: 2px; }
  .alt { margin: 1.25rem 0 0; font-size: .875rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="brand">Medication Reminder</p>
  <div class="panel">
  <h1>Sign in</h1>
  <p class="sub">Manage the reminder calls, schedules and contacts.</p>

  <form id="f" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username"
           spellcheck="false" autocapitalize="none" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button id="submit" type="submit">Sign in</button>
  </form>

  <!-- aria-live so the result is announced, not just shown -->
  <p id="msg" role="status" aria-live="polite"></p>
  </div>
  <p class="alt">No account yet? <a href="/signup">Create one</a></p>
</main>

<script>
  const form   = document.getElementById('f');
  const button = document.getElementById('submit');
  const msg    = document.getElementById('msg');

  function say(text, kind) {
    msg.textContent = text;
    msg.dataset.kind = kind || '';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    say('Signing in…');

    try {
      const response = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        // The session cookie is httpOnly, so it is never touched by this script
        // — the browser stores and returns it on its own.
        credentials: 'same-origin',
        body: JSON.stringify({
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });

      const body = await response.json().catch(() => ({}));

      if (!response.ok) {
        say(body.error || 'Sign in failed', 'error');
        button.disabled = false;
        return;
      }

      say('Signed in — loading…', 'ok');
      form.reset();
      window.location.href = '/app';
    } catch (err) {
      say('Could not reach the server: ' + err.message, 'error');
      button.disabled = false;
    }
  });
</script>
</body>
</html>
