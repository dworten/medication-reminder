<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication Reminder — Create an account</title>
<meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<script>
  try {
    var t = localStorage.getItem('medreminder.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* storage blocked — fall back to the device setting */ }
</script>
<style>
  /* Same Arctic Frost tokens as /app/style.css and /login. */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f7fb, #0f1720);
    --surface: light-dark(#ffffff, #16202c);
    --raised: light-dark(#eef3fa, #1a2531);
    --line: light-dark(#ccd8e8, #2c3a4b);
    --line-strong: light-dark(#7a8798, #6b8199);
    --fg: light-dark(#14202f, #e8eef6);
    --muted: light-dark(#55637a, #a3b1c4);
    --accent: light-dark(#2c5c9a, #8ab8ec);
    --accent-ink: light-dark(#1f4a80, #a9cdf5);
    --accent-soft: light-dark(#dde8f7, #1c3049);
    --on-accent: light-dark(#ffffff, #0f1720);
    --ok: light-dark(#0e7048, #63d29c); --ok-soft: light-dark(#dcf1e6, #14322a);
    --bad: light-dark(#b3251c, #ff9086); --bad-soft: light-dark(#fbe3e0, #3a1c1b);
    --shadow: 0 2px 8px light-dark(rgb(20 32 47 / .08), rgb(0 0 0 / .45));
    --radius: .625rem; --radius-sm: .375rem;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }
  @supports not (color: light-dark(#000, #fff)) {
    :root {
      --bg: #f4f7fb; --surface: #ffffff; --raised: #eef3fa;
      --line: #ccd8e8; --line-strong: #7a8798;
      --fg: #14202f; --muted: #55637a;
      --accent: #2c5c9a; --accent-ink: #1f4a80; --accent-soft: #dde8f7; --on-accent: #ffffff;
      --ok: #0e7048; --ok-soft: #dcf1e6;
      --bad: #b3251c; --bad-soft: #fbe3e0;
      --shadow: 0 2px 8px rgb(20 32 47 / .08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.5rem;
    display: grid; place-items: center;
    font: 16px/1.55 var(--font);
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(26rem, 100%); }

  .brand {
    display: flex; align-items: center; gap: .5rem;
    margin-bottom: 1.25rem; font-weight: 700; font-size: 1.0625rem; letter-spacing: -.01em;
  }
  .brand::before {
    content: ""; width: .5rem; height: 1.5rem; border-radius: 999px; background: var(--accent);
  }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.75rem;
    box-shadow: var(--shadow);
  }

  h1 { font-size: 1.375rem; margin: 0; letter-spacing: -.015em; }
  p.sub { margin: .25rem 0 1.5rem; color: var(--muted); font-size: .875rem; }

  label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .3125rem; }
  .hint { font-weight: 400; color: var(--muted); }
  input {
    width: 100%; padding: .5rem .625rem; margin-bottom: 1rem; min-height: 2.75rem;
    font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  input:hover { border-color: var(--accent); }
  :where(input, button, a):focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm);
  }
  button {
    width: 100%; padding: .5rem; min-height: 2.75rem;
    font: inherit; font-weight: 600;
    color: var(--on-accent); background: var(--accent);
    border: 1px solid var(--accent); border-radius: var(--radius-sm); cursor: pointer;
  }
  button:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  button[disabled] {
    color: var(--muted); background: var(--raised); border-color: var(--line); cursor: default;
  }

  #msg:not(:empty) {
    display: block; margin-top: 1rem; padding: .625rem .875rem;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--raised); color: var(--muted);
    font-size: .875rem;
  }
  #msg[data-kind="error"] { color: var(--bad); background: var(--bad-soft); border-color: var(--bad); font-weight: 600; }
  #msg[data-kind="ok"]    { color: var(--ok);  background: var(--ok-soft);  border-color: var(--ok);  font-weight: 600; }

  /* Matches the app: the field the server rejected says so under itself. */
  .field-error {
    display: flex; align-items: baseline; gap: .375rem;
    margin: -.75rem 0 1rem; color: var(--bad); font-size: .875rem; font-weight: 600;
  }
  .field-error::before { content: "!"; font-weight: 800; }

  a { color: var(--accent); text-underline-offset: 2px; }
  .alt { margin: 1.25rem 0 0; font-size: .875rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="brand">Medication Reminder</p>
  <div class="panel">
  <h1>Create an account</h1>
  <p class="sub">Set up medication reminder calls for someone.</p>

  <form id="f" novalidate>
    <label for="name">Your name <span class="hint">— optional</span></label>
    <input id="name" name="name" type="text" autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username"
           spellcheck="false" autocapitalize="none" required autofocus>

    <label for="password">Password <span class="hint">— at least 12 characters</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

    <button id="submit" type="submit">Create account</button>
  </form>

  <p id="msg" role="status" aria-live="polite"></p>
  </div>
  <p class="alt">Already have one? <a href="/login">Sign in</a></p>
</main>

<script>
  const form    = document.getElementById('f');
  const button  = document.getElementById('submit');
  const msg     = document.getElementById('msg');

  function say(text, kind) {
    msg.textContent = text;
    msg.dataset.kind = kind || '';
  }

  function clearErrors() {
    for (const el of document.querySelectorAll('.field-error')) el.remove();
  }

  // Puts the server's per-field messages under the input each one is about.
  function showErrors(details) {
    clearErrors();
    let shown = false;
    for (const [name, message] of Object.entries(details || {})) {
      const input = form.elements[name];
      if (!input) continue;
      const note = document.createElement('p');
      note.className = 'field-error';
      note.textContent = message;
      input.insertAdjacentElement('afterend', note);
      shown = true;
    }
    return shown;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearErrors();

    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    // Checked here rather than server-side: the server never sees `confirm`,
    // and it exists only to catch a typo in something you cannot read back.
    if (password !== confirm) {
      showErrors({ confirm: 'does not match' });
      say('Those passwords do not match.', 'error');
      return;
    }

    button.disabled = true;
    say('Creating your account…');

    try {
      const response = await fetch('/api/signup', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          name:     document.getElementById('name').value,
          email:    document.getElementById('email').value,
          password,
        }),
      });

      const body = await response.json().catch(() => ({}));

      if (!response.ok) {
        const marked = showErrors(body.details);
        say(marked ? 'Check the highlighted fields.' : (body.error || 'Could not create the account'), 'error');
        button.disabled = false;
        return;
      }

      // Signup signs you in, so there is nowhere to send you but the app.
      say('Account created — loading…', 'ok');
      window.location.href = '/app';
    } catch (err) {
      say('Could not reach the server: ' + err.message, 'error');
      button.disabled = false;
    }
  });
</script>
</body>
</html>
